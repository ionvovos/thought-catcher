<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Thought Catcher mockup: Device cannot run the model: rules</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<main class="app " data-screen="no-webgpu-fallback">

<header class="topbar"><button class="pill pill--warn" aria-label="Basic mode. Open settings"><span class="pill__dot"></span>Basic mode</button><button class="iconbtn" aria-label="Settings"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button></header>
<section class="stage">
  <h1 class="greeting">Good afternoon</h1>
  <button class="orb " data-state="basic" style="--level:0" aria-label="Tap to talk">
    <span class="orb__halo"></span><span class="orb__level"></span><span class="orb__ring"></span><span class="orb__ring"></span><span class="orb__ring"></span>
    <span class="orb__spinner"></span>
    <span class="orb__core"><span class="orb__swirl"><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span></span><span class="orb__gloss"></span></span>
  </button>
  <p class="hint"><strong>Tap to talk.</strong></p>
  <div class="row-actions"><button class="btn btn--secondary btn--pill"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></svg>Type</button></div>
</section>
<div style="padding:0 var(--gutter) var(--sp-3)"><div class="notice" role="status">
  <span class="notice__icon"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg></span>
  <div><h2>Basic mode on this phone</h2><p>This phone can't run the on-device assistant. I'll sort your thoughts with simple rules. You can add your own AI key in Settings.</p></div>
  <div class="notice__actions"><button class="btn btn--tinted"><svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16 7l2.5 2.5M14 9l2 2"/></svg>Add your own key</button><button class="btn btn--secondary">Got it</button></div>
</div></div>
<section class="sheet sheet--peek" aria-label="Library"><span class="grabber" role="button" aria-label="Open library"></span>
  <div class="peek"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 4.5-9 4.5-9-4.5L12 3z"/><path d="M3 12l9 4.5 9-4.5M3 16.5L12 21l9-4.5"/></svg><div class="peek__text"><div class="peek__title">Library</div><div class="typedots"><span class="t-idea">8</span><span class="t-task">6</span><span class="t-journal">6</span><span class="t-reminder">4</span></div></div><button class="iconbtn" aria-label="Search library"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button></div></section>
</main>
</body>
</html>
