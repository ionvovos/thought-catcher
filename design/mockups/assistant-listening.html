<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Thought Catcher mockup: Assistant: listening</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<main class="app " data-screen="assistant-listening">

<header class="topbar"><button class="iconbtn" aria-label="Cancel"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="topbar__center">Listening</span><button class="iconbtn" aria-label="Type instead"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></svg></button></header>
<section class="stage">
  <button class="orb " data-state="listening" style="--level:0.55" aria-label="Listening. Tap to finish">
    <span class="orb__halo"></span><span class="orb__level"></span><span class="orb__ring"></span><span class="orb__ring"></span><span class="orb__ring"></span>
    <span class="orb__spinner"></span>
    <span class="orb__core"><span class="orb__swirl"><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span></span><span class="orb__gloss"></span></span>
  </button>
  <p class="transcript" aria-live="polite"><span class="old">Okay so tomorrow I need to call the dentist about the crown, and</span> book the car service before the tenth<span class="caret"></span></p>
</section>
<footer class="dock" style="grid-template-columns:1fr"><p class="hint">Tap the orb when you're done</p></footer>
</main>
</body>
</html>
