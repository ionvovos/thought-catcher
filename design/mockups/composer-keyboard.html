<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Thought Catcher mockup: Typing composer with the keyboard open</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<main class="app " data-screen="composer-keyboard">

<header class="topbar"><button class="pill" aria-label="Assistant runs on this phone. Open settings"><span class="pill__dot"></span>On this phone</button><button class="iconbtn" aria-label="Settings"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button></header>
<section class="thread">
  <span class="msg-time">Today 15:02</span>
  <div class="msg msg--assistant" role="status"><span class="orb orb--mini" data-state="idle" aria-hidden="true"><span class="orb__core"><span class="orb__swirl"><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span></span></span></span><div class="msg__body"><p>Type your thought. Enter sends it.</p></div></div>
</section>
<div class="composer"><button class="iconbtn iconbtn--filled" aria-label="Talk instead"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button><label class="composer__field"><span>Buy stamps and post the tax form by Friday<i class="caret"></i></span><button class="dock__send" aria-label="Send"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></label></div>
<div class="kbd" aria-hidden="true"><div class="kbd__row"><span class="kbd__key">q</span><span class="kbd__key">w</span><span class="kbd__key">e</span><span class="kbd__key">r</span><span class="kbd__key">t</span><span class="kbd__key">y</span><span class="kbd__key">u</span><span class="kbd__key">i</span><span class="kbd__key">o</span><span class="kbd__key">p</span></div><div class="kbd__row"><span class="kbd__key">a</span><span class="kbd__key">s</span><span class="kbd__key">d</span><span class="kbd__key">f</span><span class="kbd__key">g</span><span class="kbd__key">h</span><span class="kbd__key">j</span><span class="kbd__key">k</span><span class="kbd__key">l</span></div><div class="kbd__row"><span class="kbd__key kbd__key--wide">⇧</span><span class="kbd__key">z</span><span class="kbd__key">x</span><span class="kbd__key">c</span><span class="kbd__key">v</span><span class="kbd__key">b</span><span class="kbd__key">n</span><span class="kbd__key">m</span><span class="kbd__key kbd__key--wide">⌫</span></div><div class="kbd__row"><span class="kbd__key kbd__key--wide">123</span><span class="kbd__key kbd__key--space">space</span><span class="kbd__key kbd__key--go">send</span></div></div>
</main>
</body>
</html>
