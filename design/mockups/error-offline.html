<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Thought Catcher mockup: Offline and a microphone error</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<main class="app " data-screen="error-offline">

<header class="topbar"><button class="pill pill--off" aria-label="Offline"><span class="pill__dot"></span>Offline</button><button class="iconbtn" aria-label="Settings"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button></header>
<div class="strip"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 12.9a10 10 0 0 1 4.2-2.4M12 20h.01M14.8 10.6A10 10 0 0 1 19 12.9M2 9.3a15 15 0 0 1 4.3-2.7M10.7 5.1A15 15 0 0 1 22 9.3"/></svg>Offline. The assistant still works on this phone; your key waits for the connection.</div>
<section class="thread">
  <div class="msg msg--user">Remind me to pick up the dry cleaning on Friday</div>
  <div class="msg msg--assistant" role="status"><span class="orb orb--mini" data-state="idle" aria-hidden="true"><span class="orb__core"><span class="orb__swirl"><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span></span></span></span><div class="msg__body"><p>Filed as a reminder for Friday 18:00.</p>
    <div class="filed"><div class="fitem" style="--i:0"><span class="ticon t-reminder" aria-hidden="true"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15L6 16zM10 20.5a2 2 0 0 0 4 0"/></svg></span><div class="fitem__main"><p class="fitem__title">Pick up the dry cleaning</p><div class="fitem__meta"><button class="badge t-reminder badge--btn" aria-label="Type: Reminder. Change type"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l1.5 2h-15L6 16zM10 20.5a2 2 0 0 0 4 0"/></svg>Reminder<svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></button><button class="chipdate" aria-label="Change date: Fri 18:00"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Fri 18:00</button></div></div><button class="iconbtn" aria-label="Edit"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 3L8 18.5 4 20zM13.5 7l3 3"/></svg></button></div></div></div></div>
  <div class="msg msg--assistant msg--error" role="alert"><span class="orb orb--mini" data-state="idle" aria-hidden="true"><span class="orb__core"><span class="orb__swirl"><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span></span></span></span><div class="msg__body"><span class="errmark"><svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M9 9v2a3 3 0 0 0 5.1 2.1M15 10V6a3 3 0 0 0-5.7-1.3M5.5 11a6.5 6.5 0 0 0 10.7 5M18.5 11a6.5 6.5 0 0 1-.4 2.2M12 17.5V21"/></svg>Microphone blocked</span><p>I couldn't hear you. The browser is blocking the microphone for this app.</p>
    <div class="replies"><button class="reply reply--accent" style="--i:0">How to allow it</button><button class="reply" style="--i:1"><svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></svg>Type instead</button></div></div></div>
</section>
<footer class="dock"><button class="iconbtn iconbtn--filled" aria-label="Type instead"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></svg></button><button class="orb orb--dock" data-state="idle" style="--level:0" aria-label="Tap to talk">
    <span class="orb__halo"></span><span class="orb__level"></span><span class="orb__ring"></span><span class="orb__ring"></span><span class="orb__ring"></span>
    <span class="orb__spinner"></span>
    <span class="orb__core"><span class="orb__swirl"><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span></span><span class="orb__gloss"></span></span>
  </button><button class="dock__done">Done</button></footer>
</main>
</body>
</html>
