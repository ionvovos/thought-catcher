<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Thought Catcher mockup: Onboarding 2: privacy</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<main class="app " data-screen="onboarding-2">

<button class="btn btn--plain skip">Skip</button>
<section class="ob">
  <div class="ob__art"><div class="shield-art"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></div></div>
  <div class="ob__copy">
    <h1>Stays on your phone</h1>
    <ul class="plist">
      <li><span class="ticon notice__icon--info"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg></span><span><strong>The assistant runs here</strong>A small model downloads once and then works offline.</span></li>
      <li><span class="ticon notice__icon--info"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.5-3.2 8.3-7.5 9.5-4.3-1.2-7.5-5-7.5-9.5V6L12 3z"/><path d="M9 12l2 2 4-4"/></svg></span><span><strong>No account</strong>Your thoughts are saved on this device. Export them any time.</span></li>
      <li><span class="ticon notice__icon--info"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l8.5-8.5M16 7l2.5 2.5M14 9l2 2"/></svg></span><span><strong>Your own key is optional</strong>Add one later for sharper answers; only the text you file is sent.</span></li>
    </ul>
  </div>
  <div class="ob__foot"><div class="pager" aria-label="Page 2 of 3"><span></span><span class="on"></span><span></span></div><button class="btn btn--primary btn--lg">Continue</button></div>
</section>
</main>
</body>
</html>
