<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Thought Catcher mockup: Thought detail (task) without AI</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<main class="app " data-screen="thought-detail-rules">

<header class="navbar"><button class="navbar__back"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Library</button><div><button class="iconbtn" aria-label="More"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18.5" cy="12" r="1.1"/></svg></button></div></header>
<section class="scroll no-scrollbar">
  <div style="display:flex;gap:8px;align-items:center"><button class="badge t-task badge--btn" aria-label="Type: Task. Change type"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-4.9"/></svg>Task<svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></button><span class="by"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>sorted by rules</span></div>
  <h1 class="d-title">Renew gym membership</h1>
  <div class="d-meta"><span>Typed, Sun 27 Sep</span><span aria-hidden="true">·</span><span>Due 12 Oct</span></div>
  <p class="d-body">Runs out on 12 October. Ask about the off-peak price.</p>
  <div class="section-h"><h2><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>Plan</h2></div>
  <button class="needs-ai" aria-disabled="true"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3l1.7 4.6L17.3 9.3l-4.6 1.7L11 15.6l-1.7-4.6L4.7 9.3l4.6-1.7L11 3zM18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg><span><strong>Break into steps</strong>Download the assistant or add a key</span><span class="pilltag">needs AI</span></button>
  <div class="section-h"><h2><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Related</h2></div>
  <div class="empty" style="padding:var(--sp-4) 0"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><strong>No related thoughts yet</strong>Thoughts with shared words or tags show up here.</div>
</section>
<footer class="actionbar"><button class="btn btn--tinted"><svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Mark done</button><button class="btn btn--secondary"><svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5A1.5 1.5 0 0 0 8.5 21h7a1.5 1.5 0 0 0 1.5-1.5L18 7M9 7V4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V7"/></svg>Delete</button></footer>
</main>
</body>
</html>
