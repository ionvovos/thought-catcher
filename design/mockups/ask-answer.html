<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Thought Catcher mockup: Ask your thoughts: answer with sources</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<main class="app " data-screen="ask-answer">

<header class="topbar"><button class="pill" aria-label="Assistant runs on this phone. Open settings"><span class="pill__dot"></span>On this phone</button><button class="iconbtn" aria-label="Settings"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button></header>
<section class="thread">
  <span class="msg-time">Today 14:40</span>
  <div class="msg msg--user">What did I say about the gym?</div>
  <div class="msg msg--assistant"><span class="orb orb--mini" data-state="idle" aria-hidden="true"><span class="orb__core"><span class="orb__swirl"><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span></span></span></span><div class="msg__body">
    <p>You want to swap two long sessions for three short ones<span class="cite">1</span>, and the membership runs out on 12 October<span class="cite">2</span>. On Sunday you wrote that running by the sea felt easier than the treadmill<span class="cite">3</span>.</p>
    <div class="sources" aria-label="Sources">
      <button class="src t-idea"><span class="cite">1</span><span class="ticon t-idea" aria-hidden="true"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.2h5c0-.9.5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg></span><span><span class="src__title">Gym plan: three short sessions</span><span class="src__when">Idea · Sat 26 Sep</span></span></button>
      <button class="src t-task"><span class="cite">2</span><span class="ticon t-task" aria-hidden="true"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.4 2.4 4.6-4.9"/></svg></span><span><span class="src__title">Renew gym membership</span><span class="src__when">Task · due 12 Oct</span></span></button>
      <button class="src t-journal"><span class="cite">3</span><span class="ticon t-journal" aria-hidden="true"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v14H7.5A2.5 2.5 0 0 0 5 19.5v-14z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19M9 7.5h6"/></svg></span><span><span class="src__title">Good run by the sea this morning</span><span class="src__when">Journal · Sun 27 Sep</span></span></button>
    </div>
    <div class="provenance"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>From 3 of your 24 thoughts. Searched on this phone.</div>
    <div class="replies"><button class="reply" style="--i:0"><svg class="i i--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 3l1.7 4.6L17.3 9.3l-4.6 1.7L11 15.6l-1.7-4.6L4.7 9.3l4.6-1.7L11 3zM18.5 14.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg>Make a plan</button><button class="reply" style="--i:1">Remind me on 10 Oct</button></div>
  </div></div>
</section>
<footer class="dock"><button class="iconbtn iconbtn--filled" aria-label="Type instead"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></svg></button><button class="orb orb--dock" data-state="idle" style="--level:0" aria-label="Tap to talk">
    <span class="orb__halo"></span><span class="orb__level"></span><span class="orb__ring"></span><span class="orb__ring"></span><span class="orb__ring"></span>
    <span class="orb__spinner"></span>
    <span class="orb__core"><span class="orb__swirl"><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span><span class="orb__blob"></span></span><span class="orb__gloss"></span></span>
  </button><button class="dock__done">Done</button></footer>
</main>
</body>
</html>
