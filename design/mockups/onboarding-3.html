<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Thought Catcher mockup: Onboarding 3: voice choice</title>
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
</head>
<body>
<main class="app " data-screen="onboarding-3">

<section class="ob" style="padding-top:var(--sp-8)">
  <div class="ob__copy">
    <h1>How should I listen?</h1>
    <p>You can change this in Settings.</p>
    <div class="choices" role="radiogroup" aria-label="Listening">
      <button class="choice" role="radio" aria-checked="true"><span class="ticon notice__icon--info"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/></svg></span><span><span class="choice__t">On this phone</span><span class="choice__s">Private and offline. One download, about 40 MB.</span></span><span class="radio"></span></button>
      <button class="choice" role="radio" aria-checked="false"><span class="ticon notice__icon--info"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span><span><span class="choice__t">Phone's speech service</span><span class="choice__s">No download. Audio goes to Apple or Google.</span></span><span class="radio"></span></button>
      <button class="choice" role="radio" aria-checked="false"><span class="ticon notice__icon--info"><svg class="i " viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8"/></svg></span><span><span class="choice__t">I'll type</span><span class="choice__s">The microphone stays off.</span></span><span class="radio"></span></button>
    </div>
    <div class="inline-toggle"><span>Speak replies aloud</span><button class="toggle" role="switch" aria-checked="true" aria-label="Speak replies aloud"></button></div>
  </div>
  <div class="ob__foot" style="margin-top:auto"><div class="pager" aria-label="Page 3 of 3"><span></span><span></span><span class="on"></span></div><button class="btn btn--primary btn--lg">Start</button></div>
</section>
</main>
</body>
</html>
