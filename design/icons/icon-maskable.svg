<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<title>Thought Catcher</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2870"/><stop offset=".55" stop-color="#16153F"/><stop offset="1" stop-color="#0B0B1F"/></linearGradient>
 <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7C7CFF" stop-opacity=".55"/><stop offset="1" stop-color="#7C7CFF" stop-opacity="0"/></radialGradient>
 <radialGradient id="base" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#E9E8FF"/><stop offset="1" stop-color="#B9B7FF"/></radialGradient>
 <radialGradient id="gloss" cx=".34" cy=".22" r=".32"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="21.8"/></filter>
 <clipPath id="clip"><circle cx="256" cy="256" r="128"/></clipPath>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<circle cx="256" cy="266" r="198" fill="url(#glow)"/>
<g clip-path="url(#clip)">
 <circle cx="256" cy="256" r="128" fill="url(#base)"/>
 <g filter="url(#blur)">
  <circle cx="218" cy="218" r="79" fill="#7C7CFF"/>
  <circle cx="310" cy="253" r="67" fill="#FF7AB6"/>
  <circle cx="241" cy="310" r="72" fill="#52D6FF"/>
  <circle cx="271" cy="294" r="36" fill="#FFC46B"/>
 </g>
 <circle cx="256" cy="256" r="128" fill="url(#gloss)"/>
</g>
<circle cx="256" cy="256" r="127" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>
</svg>
